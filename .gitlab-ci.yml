stages:
  - verify
  - e2e

image: cypress/base:20.11.0

vitest-unit-tests:
  stage: verify
  before_script:
    - yarn
  script:
    - yarn test run

check-build:
  stage: verify
  before_script:
    - yarn
  script:
    - yarn build

cypress-e2e-tests:
  image: cypress/base:20.11.0
  stage: e2e
  before_script:
    - npm install
    - yarn
    - yarn start:cypress &
  script:
    - yarn cypress:ci
  artifacts:
    expire_in: 1 day
    when: always
    paths:
      - cypress/screenshots
      - cypress/videos
